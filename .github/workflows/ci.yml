name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      tiaPortalPublicApiPath:
        description: "Optional TIA Portal PublicAPI path for non-standard runner installs"
        required: false
        type: string

jobs:
  validate:
    name: Validate
    runs-on: windows-latest

    env:
      DEFAULT_TIA_PUBLIC_API_PATH: C:\Program Files\Siemens\Automation\Portal V21\PublicAPI\V21\net48

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Resolve TIA PublicAPI path
        id: tia
        shell: pwsh
        run: |
          $path = '${{ github.event.inputs.tiaPortalPublicApiPath }}'
          if ([string]::IsNullOrWhiteSpace($path)) {
            $path = $env:DEFAULT_TIA_PUBLIC_API_PATH
          }

          $available = Test-Path -LiteralPath (Join-Path $path 'Siemens.Engineering.Base.dll')
          "path=$path" >> $env:GITHUB_OUTPUT
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($available) {
            Write-Host "TIA Portal PublicAPI found at $path"
          } else {
            Write-Error "TIA Portal PublicAPI was not found at '$path'. Install TIA Portal PublicAPI on the runner or dispatch the workflow with tiaPortalPublicApiPath. Build and tests must not be skipped silently."
            exit 1
          }

      - name: Restore
        run: dotnet restore OpenTiaToolkit.sln

      - name: Build
        run: dotnet build OpenTiaToolkit.sln --no-restore /p:TiaPortalPublicApiPath="${{ steps.tia.outputs.path }}"

      - name: Format check
        run: dotnet format OpenTiaToolkit.sln --no-restore --verify-no-changes --verbosity minimal

      - name: Fast tests
        run: dotnet test tests\OpenTiaToolkit.Tests\OpenTiaToolkit.Tests.csproj --no-build --filter "TestCategory!=Integration"

      - name: Config and docs sanity
        shell: pwsh
        run: |
          $jsonFiles = Get-ChildItem -Path . -Recurse -File -Include *.json |
            Where-Object { $_.FullName -notmatch '\\(bin|obj|artifacts|TestResults)\\' }

          foreach ($file in $jsonFiles) {
            Write-Host "Checking JSON: $($file.FullName)"
            Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json | Out-Null
          }

          $required = @(
            'README.md',
            'LICENSE',
            'CHANGELOG.md',
            'THIRD_PARTY_NOTICES.md',
            'docs\SETUP.md',
            'examples\README.md',
            'plugins\opentia-toolkit\.codex-plugin\plugin.json',
            'plugins\opentia-toolkit\.mcp.json'
          )

          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required publication file is missing: $path"
            }
          }
