name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      tiaPortalPublicApiPath:
        description: "Optional TIA Portal PublicAPI path for non-standard runner installs"
        required: false
        type: string

jobs:
  hosted:
    name: Hosted vendor-free checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore OpenTiaToolkit.sln

      - name: Dependency vulnerability scan
        run: dotnet list OpenTiaToolkit.sln package --vulnerable --include-transitive --source https://api.nuget.org/v3/index.json

      - name: Config and docs sanity
        shell: pwsh
        run: |
          $jsonFiles = Get-ChildItem -Path . -Recurse -File -Include *.json |
            Where-Object { $_.FullName -notmatch '\\(bin|obj|artifacts|TestResults)\\' }

          foreach ($file in $jsonFiles) {
            Write-Host "Checking JSON: $($file.FullName)"
            Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json | Out-Null
          }

          $required = @(
            'README.md',
            'LICENSE',
            'CHANGELOG.md',
            'THIRD_PARTY_NOTICES.md',
            'docs\SETUP.md',
            'docs\generated\command-catalog.json',
            'docs\generated\COMMAND_REFERENCE.md',
            'docs\generated\MCP_TOOL_REFERENCE.md',
            'schemas\unified-hmi-json-1.0.schema.json',
            'examples\README.md',
            'plugins\opentia-toolkit\.codex-plugin\plugin.json',
            'plugins\opentia-toolkit\.mcp.json'
          )

          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required publication file is missing: $path"
            }
          }

      - name: Plugin skill sync check
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\Sync-PluginSkills.ps1 -CheckOnly

  licensed-v21:
    name: Licensed TIA V21 validation
    if: vars.TIA_V21_SELF_HOSTED_ENABLED == 'true'
    runs-on: [self-hosted, Windows, X64, tia-v21]
    env:
      DEFAULT_TIA_PUBLIC_API_PATH: C:\Program Files\Siemens\Automation\Portal V21\PublicAPI\V21\net48

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Require licensed TIA V21 PublicAPI
        id: tia
        shell: pwsh
        run: |
          $path = '${{ github.event.inputs.tiaPortalPublicApiPath }}'
          if ([string]::IsNullOrWhiteSpace($path)) {
            $path = $env:DEFAULT_TIA_PUBLIC_API_PATH
          }

          if (-not (Test-Path -LiteralPath (Join-Path $path 'Siemens.Engineering.Base.dll'))) {
            throw "Licensed TIA V21 PublicAPI was not found at '$path'."
          }

          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore OpenTiaToolkit.sln

      - name: Build
        run: dotnet build OpenTiaToolkit.sln -c Release --no-restore /p:TiaPortalPublicApiPath="${{ steps.tia.outputs.path }}"

      - name: Format check
        run: dotnet format OpenTiaToolkit.sln --no-restore --verify-no-changes --verbosity minimal

      - name: Fast tests
        run: dotnet test tests\OpenTiaToolkit.Tests\OpenTiaToolkit.Tests.csproj -c Release --no-build --filter "TestCategory!=Integration"

      - name: Generated command reference drift check
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Generate-CommandReference.ps1 -CheckOnly

      - name: Dependency vulnerability scan
        run: dotnet list OpenTiaToolkit.sln package --vulnerable --include-transitive --source https://api.nuget.org/v3/index.json

      - name: Build and smoke staged installer payload
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Build-Installer.ps1 -Configuration Release -StageOnly -SkipBuild

      - name: Plugin skill sync check
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\Sync-PluginSkills.ps1 -CheckOnly
