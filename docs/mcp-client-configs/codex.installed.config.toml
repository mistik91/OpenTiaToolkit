# OpenTiaToolkit product-install Codex MCP server block.
# Add this to C:\Users\<you>\.codex\config.toml when not using the Codex plugin.

[mcp_servers.opentia]
command = 'C:\Program Files\OpenTiaToolkit\mcp\OpenTiaToolkit.MCP.exe'
args = []
env = { OPEN_TIA_MCP_LOG_LEVEL = "Error" }
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 600
